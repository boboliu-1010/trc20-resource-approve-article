<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1080" viewBox="0 0 1120 1080" role="img" aria-labelledby="title desc" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><title id="title">runtime 如何连接业务、资源与恢复任务？</title><desc id="desc">Facilitator 在协议验证后调用 runtime。runtime 组合 policy、coordinator 和 chain，通过受限签名器使用 Resource Owner 的资源。后台任务持续调用 reconcile。</desc><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#355CF6"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16865B"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#AC5F16"/></marker></defs><rect x="0" y="0" width="1120" height="1080" rx="24" fill="#F5F7FC" stroke="#F5F7FC"/><text x="40" y="45" font-size="17" fill="#355CF6" font-weight="600" text-anchor="start">BANK OF AI  /  x402</text><text x="40" y="95" font-size="32" fill="#17213A" font-weight="600" text-anchor="start">runtime 如何连接业务、资源与恢复任务？</text><text x="40" y="134" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">同一套赞助流程，可接入不同的存储、签名服务和部署策略。</text><rect x="40" y="173" width="1040" height="107" rx="16" fill="white" stroke="#DCE3EF"/><text x="64" y="211" font-size="24" fill="#17213A" font-weight="600" text-anchor="start">Facilitator：接入与支付结算</text><text x="64" y="248" font-size="23" fill="#52627A" font-weight="400" text-anchor="start">扩展与支付凭证验证 → runtime 完成资源赞助 → 支付方案继续结算</text><path d="M560,285 L560,319" fill="none" stroke="#355CF6" stroke-width="2.5" marker-end="url(#b)"/><rect x="40" y="333" width="1040" height="381" rx="16" fill="#EAF0FF" stroke="#C9D6FC"/><text x="64" y="379" font-size="28" fill="#355CF6" font-weight="600" text-anchor="start">Resource Sponsoring Runtime</text><text x="64" y="416" font-size="21" fill="#17213A" font-weight="400" text-anchor="start">verify：只读检查  ·  sponsor：执行赞助  ·  reconcile：恢复未完成操作</text><rect x="64" y="451" width="304" height="158" rx="16" fill="white" stroke="#DCE3EF"/><text x="84" y="491" font-size="22" fill="#17213A" font-weight="600" text-anchor="start">Policy · 赞助策略</text><text x="84" y="537" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">哪些请求可以赞助</text><text x="84" y="575" font-size="19" fill="#52627A" font-weight="400" text-anchor="start">白名单、成本与业务额度</text><rect x="408" y="451" width="304" height="158" rx="16" fill="white" stroke="#DCE3EF"/><text x="428" y="491" font-size="22" fill="#17213A" font-weight="600" text-anchor="start">Coordinator · 协调器</text><text x="428" y="537" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">记录进度，预留资源与预算</text><text x="428" y="575" font-size="19" fill="#52627A" font-weight="400" text-anchor="start">持久化、防重复、并发控制</text><rect x="752" y="451" width="304" height="158" rx="16" fill="white" stroke="#DCE3EF"/><text x="772" y="491" font-size="22" fill="#17213A" font-weight="600" text-anchor="start">Chain · 链上适配器</text><text x="772" y="537" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">连接 TRON 并执行操作</text><text x="772" y="575" font-size="19" fill="#52627A" font-weight="400" text-anchor="start">估算、委托、广播、确认</text><text x="64" y="655" font-size="23" fill="#17213A" font-weight="500" text-anchor="start">SDK 编排整个资源生命周期；部署方接入自己的模块实现。</text><text x="64" y="688" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">资源确认恢复后，才将对应容量重新计入可用额度。</text><path d="M904,721 L904,805" fill="none" stroke="#355CF6" stroke-width="2.5" marker-end="url(#b)"/><text x="884" y="764" font-size="19" fill="#355CF6" font-weight="500" text-anchor="end">资源操作意图</text><path d="M292,805 L292,721" fill="none" stroke="#16865B" stroke-width="2.5" marker-end="url(#g)"/><text x="310" y="764" font-size="19" fill="#16865B" font-weight="500" text-anchor="start">定期调用 reconcile()</text><rect x="40" y="820" width="590" height="183" rx="16" fill="white" stroke="#DCE3EF"/><text x="64" y="860" font-size="25" fill="#17213A" font-weight="600" text-anchor="start">后台恢复任务 + 持久化状态</text><text x="64" y="902" font-size="22" fill="#52627A" font-weight="400" text-anchor="start">部署方接入任务调度、监控和告警</text><text x="64" y="944" font-size="22" fill="#52627A" font-weight="400" text-anchor="start">请求中断后继续查询、撤回与恢复</text><text x="64" y="979" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">支持重启恢复，取决于持久化协调器的实现</text><rect x="658" y="820" width="422" height="183" rx="16" fill="white" stroke="#DCE3EF"/><text x="682" y="860" font-size="24" fill="#17213A" font-weight="600" text-anchor="start">Resource Owner · 资源账户</text><text x="682" y="902" font-size="22" fill="#52627A" font-weight="400" text-anchor="start">提供 Stake 2.0 能量与带宽</text><text x="682" y="944" font-size="22" fill="#52627A" font-weight="400" text-anchor="start">受限签名器签署委托 / 撤回</text><text x="682" y="979" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">可适配兼容的远程钱包或 HSM</text><text x="40" y="1048" font-size="21" fill="#17213A" font-weight="500" text-anchor="start">付款钱包签署 approve；Resource Owner 签署资源操作，两者职责不同。</text></svg>