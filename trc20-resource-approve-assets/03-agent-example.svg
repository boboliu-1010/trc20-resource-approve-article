<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="652" viewBox="0 0 1120 652" role="img" aria-labelledby="title desc" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><title id="title">示例：Agent 用 0.05 USDT 购买一份数据</title><desc id="desc">已激活的 Agent 钱包有 10 USDT、0 TRX，首次购买报价为 0.05 USDT 的数据。赞助方准备授权资源后，完成支付并返回数据。</desc><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#355CF6"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16865B"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#AC5F16"/></marker></defs><rect x="0" y="0" width="1120" height="652" rx="24" fill="#F5F7FC" stroke="#F5F7FC"/><text x="40" y="45" font-size="17" fill="#355CF6" font-weight="600" text-anchor="start">BANK OF AI  /  x402</text><text x="40" y="95" font-size="32" fill="#17213A" font-weight="600" text-anchor="start">示例：Agent 用 0.05 USDT 购买一份数据</text><text x="40" y="135" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">假设服务已开启赞助，资产受支持，并且资源充足。</text><rect x="40" y="179" width="280" height="307" rx="16" fill="white" stroke="#DCE3EF"/><text x="64" y="222" font-size="24" fill="#17213A" font-weight="600" text-anchor="start">付款钱包</text><rect x="420" y="179" width="280" height="307" rx="16" fill="white" stroke="#DCE3EF"/><text x="444" y="222" font-size="24" fill="#17213A" font-weight="600" text-anchor="start">支付基础设施</text><rect x="800" y="179" width="280" height="307" rx="16" fill="white" stroke="#DCE3EF"/><text x="824" y="222" font-size="24" fill="#17213A" font-weight="600" text-anchor="start">数据服务</text><text x="64" y="279" font-size="37" fill="#355CF6" font-weight="600" text-anchor="start">10 USDT</text><text x="64" y="320" font-size="29" fill="#17213A" font-weight="500" text-anchor="start">0 TRX</text><text x="64" y="371" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">账户已激活</text><text x="64" y="403" font-size="19" fill="#52627A" font-weight="400" text-anchor="start">尚未完成 Permit2 授权</text><text x="64" y="451" font-size="21" fill="#355CF6" font-weight="500" text-anchor="start">确认报价并签名</text><text x="444" y="280" font-size="25" fill="#17213A" font-weight="500" text-anchor="start">验证签名</text><text x="444" y="326" font-size="25" fill="#17213A" font-weight="500" text-anchor="start">准备授权资源</text><text x="444" y="372" font-size="25" fill="#17213A" font-weight="500" text-anchor="start">完成 approve</text><text x="444" y="451" font-size="21" fill="#16865B" font-weight="500" text-anchor="start">继续结算 0.05 USDT</text><text x="824" y="280" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">报价</text><text x="824" y="328" font-size="31" fill="#16865B" font-weight="600" text-anchor="start">0.05 USDT</text><text x="824" y="381" font-size="23" fill="#17213A" font-weight="500" text-anchor="start">付款成功</text><text x="824" y="451" font-size="21" fill="#16865B" font-weight="500" text-anchor="start">返回数据结果</text><path d="M330,337 L408,337" fill="none" stroke="#355CF6" stroke-width="2.5" marker-end="url(#b)"/><path d="M710,337 L788,337" fill="none" stroke="#16865B" stroke-width="2.5" marker-end="url(#g)"/><rect x="40" y="514" width="1040" height="91" rx="16" fill="#EAF6F0" stroke="#EAF6F0"/><text x="64" y="550" font-size="25" fill="#16865B" font-weight="600" text-anchor="start">Agent 获得所需数据，继续完成任务。</text><text x="64" y="582" font-size="19" fill="#52627A" font-weight="400" text-anchor="start">0.05 USDT 为示例服务价格；赞助条件及其他收费以服务规则为准。</text></svg>